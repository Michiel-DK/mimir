name: handoff
# Carry a triage's pickup blocks to the lanes' repos as issues (or docs PRs). Manual trigger only:
# the triage that produced the blocks was run by your agent and committed by you, so this step
# runs when you say so, never on a schedule. Needs two things in your fork:
#   * a committed radar.yaml (or RADAR_YAML pointing at a committed profile) with a `handoff:` block;
#   * secret HANDOFF_TOKEN: a token with issues + contents + pull-requests write on the target repos
#     (the default GITHUB_TOKEN only reaches this repo).
# The ledger data/handoff/<date>.json is committed so a re-run opens nothing twice.
on:
  workflow_dispatch:
    inputs:
      date: {description: "Triage date (YYYY-MM-DD) whose pickup blocks to hand off", required: true, type: string}
      lane: {description: "Only this lane id (optional)", required: false, type: string, default: ""}
      dry_run: {description: "Print the notes, send nothing", type: boolean, default: true}
concurrency: {group: handoff, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Hand off
        env:
          GH_TOKEN: "${{ secrets.HANDOFF_TOKEN }}"
          RADAR_YAML: "${{ vars.RADAR_YAML }}"   # optional: path to a committed profile; default radar.yaml
        run: |
          python3 scripts/handoff.py --date "${{ inputs.date }}" \
            ${{ inputs.lane != '' && format('--lane {0}', inputs.lane) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit ledger
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/handoff
          git diff --cached --quiet && { echo "no ledger change"; exit 0; }
          git commit -m "handoff: ledger ${{ inputs.date }} [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
