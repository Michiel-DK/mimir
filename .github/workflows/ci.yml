name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s tests -v
      - name: Example profile loads and the fetchers accept it
        run: RADAR_YAML=radar.example.yaml python3 -c "import sys; sys.path.insert(0,'scripts'); import radar_config as c; cfg=c.load(); print(len(cfg['lanes']), 'lanes'); assert cfg['lanes']"
      - name: Leak gate on the tree (secrets only; your banned terms live in git-ignored leakgate.txt)
        run: python3 scripts/leak_gate.py --secrets-only .
