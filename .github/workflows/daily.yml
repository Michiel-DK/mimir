name: daily-radar
# GitHub trending (per slice in radar.yaml) + demand signals, diffed into newcomers / climbers /
# persisters. A slice that fails after retries is reported in data/daily/<date>.meta.json and as a
# workflow error annotation — the run stays green so the other slices still land, but it is loud.
# No schedule here: the public repo is the tool. Tracking runs in the author's private instance;
# run this by hand to refresh the example, or add your own `schedule:` in your fork.
on:
  workflow_dispatch:
concurrency: {group: daily-radar, cancel-in-progress: false}
permissions: {contents: write}
env:
  # radar.yaml is git-ignored, so this runner has no profile and the fetchers use their built-in
  # default queries. To fetch with YOUR tracks, commit a queries-only profile (no lanes) and set the
  # repository variable RADAR_YAML to its path. Empty = defaults.
  RADAR_YAML: "${{ vars.RADAR_YAML }}"
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch trending + compute trends
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          python3 scripts/fetch_trending.py
          python3 scripts/compute_trends.py
      - name: Fetch demand signals (best-effort)
        env:
          REDDIT_CLIENT_ID: "${{ secrets.REDDIT_CLIENT_ID }}"
          REDDIT_CLIENT_SECRET: "${{ secrets.REDDIT_CLIENT_SECRET }}"
        run: python3 scripts/fetch_problems.py || echo "::warning::fetch_problems failed; continuing"
      - name: Leak gate on scraped data (secrets only)
        run: python3 scripts/leak_gate.py --secrets-only data
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: $(date -u +%F) trending snapshot [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
