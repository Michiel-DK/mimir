name: leak-gate
on:
  push:
  pull_request:
jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Leak gate over all tracked files (secret shapes + leakgate.example.txt)
        run: git ls-files -z | xargs -0 python3 scripts/leak_gate.py --terms=leakgate.example.txt
