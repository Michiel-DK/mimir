name: weekly-papers
# HF blog + arXiv (via OpenAlex) for the tracks in radar.yaml → a new dated section at the top of
# PAPERS.md, plus the week's GitHub-trending ARRIVALS (data/arrivals/<date>.md) from the daily snapshots. The triage itself is run by your agent with skills/radar-triage, not by this workflow.
# Kill clause per source: two consecutive triages promoting nothing from a source → drop it.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run: {description: "Print the section, commit nothing", type: boolean, default: false}
concurrency: {group: weekly-papers, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  papers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch HF blog + arXiv
        env: {OPENALEX_API_KEY: "${{ secrets.OPENALEX_API_KEY }}"}  # optional
        run: python3 scripts/fetch_papers.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Arrivals for the last 7 days (needs data/daily from daily.yml; skipped when empty)
        run: |
          if ls data/daily/*.jsonl >/dev/null 2>&1; then
            python3 scripts/arrivals.py ${{ inputs.dry_run && '--stdout' || '' }}
          else
            echo "::notice::no daily snapshots yet; arrivals skipped"
          fi
      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PAPERS.md data/hf_blog_seen.json data/papers_seen.json data/arrivals
          git diff --cached --quiet || git commit -m "weekly: papers section + arrivals $(date -u +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
